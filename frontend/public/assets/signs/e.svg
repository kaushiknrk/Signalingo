<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#007A6E" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#FFB703" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="130" fill="#FFFFFF" opacity="0.12" />
  
  <!-- Outer Ring Accent -->
  <circle cx="200" cy="180" r="100" stroke="#FFB703" stroke-width="6" fill="none" stroke-dasharray="12 8" opacity="0.75" />

  <!-- Stylized ASL Hand Shape Vector -->
  <g filter="url(#shadow)" transform="translate(110, 80)">
    <!-- Palm / Base Wrist -->
    <path d="M 50 170 C 40 140 35 110 40 70 C 45 40 70 30 90 30 C 110 30 135 40 140 70 C 145 110 140 140 130 170 Z" fill="url(#handGrad)" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Fingers / Knuckles Gesture -->
    <rect x="50" y="45" width="18" height="55" rx="9" fill="#FFE29A" stroke="#0F172A" stroke-width="3" />
    <rect x="72" y="32" width="18" height="65" rx="9" fill="#FFE29A" stroke="#0F172A" stroke-width="3" />
    <rect x="94" y="38" width="18" height="60" rx="9" fill="#FFE29A" stroke="#0F172A" stroke-width="3" />
    <rect x="116" y="52" width="16" height="48" rx="8" fill="#FFE29A" stroke="#0F172A" stroke-width="3" />
    
    <!-- Thumb -->
    <path d="M 35 110 C 20 95 30 75 55 85 C 65 90 65 115 50 125 Z" fill="#FFB703" stroke="#0F172A" stroke-width="3" />
    
    <!-- Wrist cuff detailing -->
    <path d="M 45 160 Q 90 175 135 160" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Character Label Badge -->
  <rect x="40" y="310" width="320" height="60" rx="20" fill="#0F172A" opacity="0.95"/>
  <text x="200" y="352" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFB703" text-anchor="middle" letter-spacing="2">
    E
  </text>
</svg>